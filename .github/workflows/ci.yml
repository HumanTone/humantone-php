name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
    branches: [main]

jobs:
  test:
    name: PHP ${{ matrix.php }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        os: [ubuntu-latest]
        include:
          - php: '8.3'
            os: macos-latest
          - php: '8.3'
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, mbstring
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run unit tests
        run: composer test

      - name: Run PHPStan
        run: composer analyse

      - name: Check code style
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

  verify-version-matches-tag:
    name: Verify Client::SDK_VERSION matches tag
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare Client::SDK_VERSION to tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          CONSTANT=$(grep -oP "SDK_VERSION = '\K[^']+" src/Client.php)
          if [ "$TAG" != "$CONSTANT" ]; then
            echo "Tag '$TAG' does not match Client::SDK_VERSION '$CONSTANT'"
            exit 1
          fi
          echo "Tag and constant match: $TAG"
